<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spool Manager</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;500;700&display=swap');

  :root {
    --bg:        #0a0c10;
    --panel:     #111420;
    --border:    #1e2535;
    --accent:    #00d4ff;
    --accent2:   #ff6b35;
    --text:      #c8d8e8;
    --muted:     #4a5a6a;
    --success:   #00ff9d;
    --drybox:    #00d4ff22;
    --standby:   #ff6b3522;
    --radius:    6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 24px 16px;
  }

  /* scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,212,255,0.015) 2px,
      rgba(0,212,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
  }

  .logo {
    width: 36px; height: 36px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    display: grid; place-items: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 1px;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(0,212,255,0.4); }
    50%      { box-shadow: 0 0 0 8px rgba(0,212,255,0); }
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
  }

  .status-bar {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
  }

  .status-bar span { color: var(--success); }

  /* layout */
  .locations-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }

  .location-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .location-panel[data-location="Drybox"] { border-top: 2px solid var(--accent); }
  .location-panel:not([data-location="Drybox"]) { border-top: 2px solid var(--accent2); }

  .location-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }

  .location-name {
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .location-panel[data-location="Drybox"] .location-name { color: var(--accent); }
  .location-panel:not([data-location="Drybox"]) .location-name { color: var(--accent2); }

  .spool-count {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text);
  }

  .drybox-note {
    font-size: 12px;
    color: var(--text);
    padding: 6px 16px;
    border-bottom: 1px solid var(--border);
    font-style: italic;
  }

  /* drop zone */
  .spool-list {
    padding: 10px;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .spool-list.drag-over {
    background: rgba(0,212,255,0.04);
    outline: 1px dashed var(--accent);
    outline-offset: -4px;
  }

  .location-panel:not([data-location="Drybox"]) .spool-list.drag-over {
    background: rgba(255,107,53,0.04);
    outline-color: var(--accent2);
  }

  /* spool card */
  .spool-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    cursor: grab;
    transition: border-color 0.15s, transform 0.15s, opacity 0.15s;
    user-select: none;
  }

  .spool-card:active { cursor: grabbing; }
  .spool-card:hover { border-color: var(--muted); }

  .spool-card.dragging {
    opacity: 0.35;
    transform: scale(0.97);
  }

  .spool-card.drag-target-above { border-top: 2px solid var(--accent); }
  .spool-card.drag-target-below { border-bottom: 2px solid var(--accent); }

  .color-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .spool-info { flex: 1; min-width: 0; }

  .spool-name {
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .spool-meta {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text);
    margin-top: 2px;
  }

  .spool-id {
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    color: var(--text);
    flex-shrink: 0;
  }

  .drag-handle {
    color: var(--text);
    font-size: 16px;
    flex-shrink: 0;
    opacity: 0.5;
  }

  /* slot badge for drybox */
  .slot-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 3px;
    padding: 1px 5px;
    flex-shrink: 0;
  }

  /* empty state */
  .empty-state {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 1px;
  }

  /* toast */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--panel);
    border: 1px solid var(--success);
    color: var(--success);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    padding: 10px 18px;
    border-radius: var(--radius);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 1000;
  }

  .toast.error { border-color: var(--accent2); color: var(--accent2); }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* loading */
  .loading {
    text-align: center;
    padding: 60px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0.3; } }
</style>
</head>
<body>

<header>
  <div class="logo">SPL</div>
  <h1>Spool Manager</h1>
  <div class="status-bar" id="statusBar">LOADING<span>...</span></div>
</header>

<div id="app"><div class="loading">INITIALISING...</div></div>
<div class="toast" id="toast"></div>

<script>
// ─── State ───────────────────────────────────
let locations   = [];   // ["Drybox","Standby",...]
let spoolsByLoc = {};   // { "Drybox": [...], "Standby": [...] }
let slotOrder   = [];   // [1, 3]  — Drybox ordered IDs from ESP32

let dragSpool   = null; // { id, fromLocation }
let dragEl      = null;

// ─── Boot ────────────────────────────────────
async function init() {
  try {
    const [locRaw, orderRaw] = await Promise.all([
      fetch('/locations').then(r => r.json()),
      fetch('/slotorder').then(r => r.json())
    ]);

    // Spoolman returns { value: '["Drybox","Standby"]', ... }
    locations = typeof locRaw.value === 'string'
      ? JSON.parse(locRaw.value)
      : locRaw;

    slotOrder = Array.isArray(orderRaw) ? orderRaw : [];

    // Fetch spools for every location in parallel
    const fetches = locations.map(loc =>
      fetch(`/spools?location=${encodeURIComponent(loc)}`).then(r => r.json())
    );
    const results = await Promise.all(fetches);
    locations.forEach((loc, i) => { spoolsByLoc[loc] = results[i]; });

    render();
    document.getElementById('statusBar').innerHTML =
      `ONLINE &nbsp;<span>●</span>`;
  } catch(e) {
    document.getElementById('app').innerHTML =
      `<div class="empty-state">FAILED TO LOAD — ${e.message}</div>`;
  }
}

// ─── Render ──────────────────────────────────
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const grid = document.createElement('div');
  grid.className = 'locations-grid';

  // Always render Drybox first
  const ordered = ['Drybox', ...locations.filter(l => l !== 'Drybox')];

  ordered.forEach(loc => {
    const spools = spoolsByLoc[loc] || [];
    const isDrybox = loc === 'Drybox';

    // Apply slot order to Drybox spools
    let displaySpools = [...spools];
    if (isDrybox && slotOrder.length) {
      displaySpools.sort((a, b) => {
        const ai = slotOrder.indexOf(a.id);
        const bi = slotOrder.indexOf(b.id);
        const aPos = ai === -1 ? 9999 : ai;
        const bPos = bi === -1 ? 9999 : bi;
        return aPos - bPos;
      });
    }

    const panel = document.createElement('div');
    panel.className = 'location-panel';
    panel.dataset.location = loc;

    panel.innerHTML = `
      <div class="location-header">
        <div class="location-name">${loc}</div>
        <div class="spool-count">${spools.length} SPOOL${spools.length !== 1 ? 'S' : ''}</div>
      </div>
      ${isDrybox ? '<div class="drybox-note">Drag to reorder slots · Move to other locations below</div>' : ''}
    `;

    const list = document.createElement('div');
    list.className = 'spool-list';
    list.dataset.location = loc;

    // Drop zone events
    list.addEventListener('dragover', onDragOver);
    list.addEventListener('dragleave', onDragLeave);
    list.addEventListener('drop', e => onDrop(e, loc));

    if (displaySpools.length === 0) {
      list.innerHTML = '<div class="empty-state">NO SPOOLS</div>';
    } else {
      displaySpools.forEach((spool, idx) => {
        list.appendChild(buildSpoolCard(spool, loc, isDrybox ? idx + 1 : null));
      });
    }

    panel.appendChild(list);
    grid.appendChild(panel);
  });

  app.appendChild(grid);
}

function buildSpoolCard(spool, location, slotNum) {
  const card = document.createElement('div');
  card.className = 'spool-card';
  card.draggable = true;
  card.dataset.id = spool.id;
  card.dataset.location = location;

  const color = spool.filament?.color_hex
    ? `#${spool.filament.color_hex}`
    : '#444';

  const weight = spool.remaining_weight != null
    ? `${Math.round(spool.remaining_weight)}g remaining`
    : '';

  card.innerHTML = `
    <div class="drag-handle">⠿</div>
    ${slotNum != null ? `<div class="slot-badge">S${slotNum}</div>` : ''}
    <div class="color-dot" style="background:${color}"></div>
    <div class="spool-info">
      <div class="spool-name">${spool.filament?.name ?? 'Unknown'}</div>
      <div class="spool-meta">${spool.filament?.material ?? ''} · ${weight}</div>
    </div>
    <div class="spool-id">#${spool.id}</div>
  `;

  card.addEventListener('dragstart', e => onDragStart(e, spool, location));
  card.addEventListener('dragend', onDragEnd);
  card.addEventListener('dragover', onCardDragOver);
  card.addEventListener('dragleave', onCardDragLeave);

  return card;
}

// ─── Drag & Drop ─────────────────────────────
function onDragStart(e, spool, fromLocation) {
  dragSpool = { spool, fromLocation };
  dragEl = e.currentTarget;
  setTimeout(() => dragEl.classList.add('dragging'), 0);
  e.dataTransfer.effectAllowed = 'move';
}

function onDragEnd() {
  if (dragEl) dragEl.classList.remove('dragging');
  document.querySelectorAll('.drag-target-above, .drag-target-below, .drag-over')
    .forEach(el => el.classList.remove('drag-target-above', 'drag-target-below', 'drag-over'));
  dragEl = null;
}

function onDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}

function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function onCardDragOver(e) {
  e.preventDefault();
  if (!dragSpool) return;
  const card = e.currentTarget;
  if (card === dragEl) return;
  const rect = card.getBoundingClientRect();
  const mid  = rect.top + rect.height / 2;
  document.querySelectorAll('.drag-target-above, .drag-target-below')
    .forEach(el => el.classList.remove('drag-target-above', 'drag-target-below'));
  card.classList.add(e.clientY < mid ? 'drag-target-above' : 'drag-target-below');
}

function onCardDragLeave(e) {
  e.currentTarget.classList.remove('drag-target-above', 'drag-target-below');
}

async function onDrop(e, toLocation) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!dragSpool) return;

  const { spool, fromLocation } = dragSpool;

  // ── Moving between locations ──────────────
  if (fromLocation !== toLocation) {
    try {
      const res = await fetch('/movespool', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: spool.id, location: toLocation })
      });
      if (!res.ok) throw new Error();

      // Update local state
      spoolsByLoc[fromLocation] = spoolsByLoc[fromLocation].filter(s => s.id !== spool.id);
      spool.location = toLocation;
      spoolsByLoc[toLocation] = [...(spoolsByLoc[toLocation] || []), spool];

      // Remove from drybox slot order if leaving Drybox
      if (fromLocation === 'Drybox') {
        slotOrder = slotOrder.filter(id => id !== spool.id);
        await saveSlotOrder();
      }
      // Add to drybox slot order if entering Drybox
      if (toLocation === 'Drybox' && !slotOrder.includes(spool.id)) {
        slotOrder.push(spool.id);
        await saveSlotOrder();
      }

      render();
      showToast(`#${spool.id} moved to ${toLocation}`);
    } catch {
      showToast('Move failed', true);
    }
    return;
  }

  // ── Reordering within Drybox ──────────────
  if (toLocation === 'Drybox') {
    const targetCard = document.querySelector('.drag-target-above, .drag-target-below');
    if (!targetCard) return;

    const targetId    = parseInt(targetCard.dataset.id);
    const insertAbove = targetCard.classList.contains('drag-target-above');

    // Rebuild order based on current display order
    const currentOrder = [...document.querySelectorAll(
      `.location-panel[data-location="Drybox"] .spool-card`
    )].map(c => parseInt(c.dataset.id));

    const fromIdx  = currentOrder.indexOf(spool.id);
    let   toIdx    = currentOrder.indexOf(targetId);
    if (fromIdx === -1 || toIdx === -1) return;

    currentOrder.splice(fromIdx, 1);
    toIdx = currentOrder.indexOf(targetId);
    currentOrder.splice(insertAbove ? toIdx : toIdx + 1, 0, spool.id);

    slotOrder = currentOrder;
    await saveSlotOrder();
    render();
    showToast('Slot order saved');
  }
}

// ─── API calls ───────────────────────────────
async function saveSlotOrder() {
  await fetch('/slotorder', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(slotOrder)
  });
}

// ─── Toast ───────────────────────────────────
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '') + ' show';
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── Go ──────────────────────────────────────
init();
</script>
</body>
</html>
